name: Release

# Builds the Windows installer and attaches it to a GitHub release.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.0.
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

defaults:
    run:
        working-directory: apps/frontend

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Rust setup
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./apps/frontend/src-tauri -> target"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install app dependencies
              run: bun install

            - name: Build app
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: draft-coach-v__VERSION__
                  releaseName: "Draft Coach v__VERSION__"
                  releaseBody: "Descarga el instalador `.exe` (o el `.msi`) de abajo y ejecútalo."
                  releaseDraft: false
                  prerelease: false
                  projectPath: apps/frontend
                  tauriScript: bun run tauri
